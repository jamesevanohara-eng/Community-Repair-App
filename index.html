<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FixFishers — Community Map</title>

  <link rel="stylesheet" href="style.css">

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    defer
  ></script>

  <script src="script.js" defer></script>
</head>

<body>

  <header class="header">
    <div class="brand">
      <span class="brand-mark">F+</span>
      <span>Fix<span>Fishers</span></span>
    </div>

    <button id="reportButton" class="report-button">
      + Report an issue
    </button>
  </header>

  <main>

    <section class="intro">
      <div>
        <p class="eyebrow">COMMUNITY REPAIR</p>

        <h1>
          See something that needs fixing?
          <span>Put it on the map.</span>
        </h1>

        <p class="description">
          Explore community-reported issues around Fishers and help
          make your neighborhood better.
        </p>
      </div>
    </section>

    <section class="map-section">

      <div class="map-header">
        <div>
          <h2>Community map</h2>
          <p>Explore reported issues around Fishers.</p>
        </div>

        <div class="map-status">
          <span></span>
          Live map
        </div>
      </div>

      <div id="map"></div>

      <div class="legend">

        <div>
          <span class="legend-dot new"></span>
          New
        </div>

        <div>
          <span class="legend-dot review"></span>
          Under review
        </div>

        <div>
          <span class="legend-dot resolved"></span>
          Resolved
        </div>

      </div>

    </section>

  </main>

</body>
</html>
